name: Generate Dataset Mapping

on:
  push:
    branches:
      - incubation
    paths:
      - 'lm_eval/tasks/**/*.yaml'
      - '.github/scripts/generate_dataset_table.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: incubation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate dataset mapping table
        run: python .github/scripts/generate_dataset_table.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dataset-mapping.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update benchmark dataset mapping table [skip ci]"
            git push
          fi
